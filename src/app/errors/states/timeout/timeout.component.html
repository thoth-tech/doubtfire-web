<div class="flex flex-col items-center justify-center">
  <mat-icon class="my-12 scale-[4]">schedule</mat-icon>
  <h1>Authentication Timeout</h1>
  <p>Your session has expired and you need to log back in to proceed.</p>
  <p>Taking you back to the sign in page in a few seconds.</p>
  <button color="primary" mat-button type="button" (click)="signInAgain()">Sign in again</button>
</div>
