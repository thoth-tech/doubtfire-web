<div class="chart-container">
  <ngx-charts-gauge
    class="progress-gauge-chart"
    [view]=""
    [results]="gaugeData"
    [legend]="legend"
    [legendTitle]="''"
    [min]="0"
    [max]="100"
    [units]="'%'"
    [bigSegments]="10"
    [smallSegments]="5"
    [angleSpan]="240"
    [startAngle]="-120"
    [showAxis]="true"
    [scheme]="colorScheme"
    (select)="onSelect($event)"
    >
  </ngx-charts-gauge>
</div>
