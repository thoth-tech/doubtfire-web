<div class="admin-dashboard-container">
  <h2 class="dashboard-title">Admin Dashboard</h2>

  <div class="filter-row">
    <mat-form-field appearance="fill">
      <mat-label>Tutor</mat-label>
      <mat-select [(value)]="selectedTutor">
        <mat-option value="All">All</mat-option>
        <mat-option *ngFor="let tutor of getUniqueTutors()" [value]="tutor">{{ tutor }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Unit</mat-label>
      <mat-select [(value)]="selectedUnit">
        <mat-option value="All">All</mat-option>
        <mat-option *ngFor="let unit of getUniqueUnits()" [value]="unit">{{ unit }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Project</mat-label>
      <mat-select [(value)]="selectedProject">
        <mat-option value="All">All</mat-option>
        <mat-option *ngFor="let project of getUniqueProjects()" [value]="project">{{ project }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <input matInput [matDatepicker]="fromPicker" placeholder="From" [(ngModel)]="dateFrom">
      <mat-datepicker-toggle matSuffix [for]="fromPicker"></mat-datepicker-toggle>
      <mat-datepicker #fromPicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <input matInput [matDatepicker]="toPicker" placeholder="To" [(ngModel)]="dateTo">
      <mat-datepicker-toggle matSuffix [for]="toPicker"></mat-datepicker-toggle>
      <mat-datepicker #toPicker></mat-datepicker>
    </mat-form-field>
  </div>

  <mat-card class="chart-section">
    <ngx-charts-bar-vertical
      [view]="[700, 300]"
      [scheme]="colorScheme"
      [results]="chartData"
      [gradient]="false"
      [xAxis]="true"
      [yAxis]="true"
      [legend]="false"
      [showXAxisLabel]="true"
      [xAxisLabel]="'Tutors'"
      [showYAxisLabel]="true"
      [yAxisLabel]="'Duration (min)'">
    </ngx-charts-bar-vertical>
  </mat-card>

  <mat-card class="table-section">
    <table mat-table [dataSource]="filteredSessions" class="mat-elevation-z1 full-width-table">

      <ng-container matColumnDef="tutorName">
        <th mat-header-cell *matHeaderCellDef>Tutor</th>
        <td mat-cell *matCellDef="let element">{{ element.tutorName }}</td>
      </ng-container>

      <ng-container matColumnDef="unitName">
        <th mat-header-cell *matHeaderCellDef>Unit</th>
        <td mat-cell *matCellDef="let element">{{ element.unitName }}</td>
      </ng-container>

      <ng-container matColumnDef="projectName">
        <th mat-header-cell *matHeaderCellDef>Project</th>
        <td mat-cell *matCellDef="let element">{{ element.projectName }}</td>
      </ng-container>

      <ng-container matColumnDef="durationMinutes">
        <th mat-header-cell *matHeaderCellDef>Duration (min)</th>
        <td mat-cell *matCellDef="let element">{{ element.durationMinutes }}</td>
      </ng-container>

      <ng-container matColumnDef="tasksMarked">
        <th mat-header-cell *matHeaderCellDef>Tasks</th>
        <td mat-cell *matCellDef="let element">{{ element.tasksMarked }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card>
</div>
