<div class="container" *ngIf="unit?.hasGroupwork()">
  <group-set-manager [project]="project" [unit]="unit" [(selectedGroupSet)]="selectedGroupSet">
  </group-set-manager>
</div>
<div class="container" *ngIf="unit && !unit.hasGroupwork()">
  <div class="large-notice-block">
    <i class="fa fa-2x fa-users"></i>
    <p>No Group Work</p>
  </div>
  <div class="text-center text-muted col-sm-12 col-md-6 col-md-offset-3">
    There is no group work enabled for this unit.
  </div>
</div>
