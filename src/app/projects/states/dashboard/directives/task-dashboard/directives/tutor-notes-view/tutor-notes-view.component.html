<!-- In a dialog the title is the dialog's own, so only the lines under it show here. -->
<header
  class="shrink-0 border-b border-ot-divider px-4 pb-3"
  [ngClass]="inDialog ? 'pt-0' : 'pt-4'"
>
  @if (!inDialog) {
    <h2 class="m-0 mb-1 truncate text-lg leading-snug font-semibold text-ot-text">
      Moderation notes
    </h2>
  }
  <p class="m-0 text-sm text-ot-muted">{{ description }}</p>
  @if (task) {
    <p class="m-0 mt-1 truncate text-sm text-ot-muted">
      {{ task.definition.abbreviation }} {{ task.definition.name }}
      @if (task.project?.student?.displayName; as studentName) {
        ({{ studentName }})
      }
    </p>
  }
</header>

<f-tutor-notes
  class="flex min-h-0 flex-1 flex-col"
  [task]="task"
  [unitRole]="unitRole"
></f-tutor-notes>
