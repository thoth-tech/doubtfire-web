<div class="mr-3.5 flex justify-end gap-0.5" id="overflowContainer">
  <!-- <button type="button" (click)="react()" matTooltip="React to this comment" mat-icon-button
    aria-label="React to this comment">
    <mat-icon>tag_faces</mat-icon>
  </button> -->
  <button
    aria-label="Reply to this comment"
    class="bubble-action"
    matTooltip="Reply to this comment"
    matTooltipPosition="above"
    type="button"
    (click)="reply()"
  >
    <mat-icon>reply</mat-icon>
  </button>
  <button
    aria-label="Edit this comment"
    class="bubble-action"
    matTooltip="Edit this comment"
    matTooltipPosition="above"
    type="button"
    [hidden]="!comment.currentUserCanEdit"
    (click)="edit()"
  >
    <mat-icon>edit</mat-icon>
  </button>
  <button
    aria-label="Delete this comment"
    class="bubble-action"
    matTooltip="Delete this comment"
    matTooltipPosition="above"
    type="button"
    [hidden]="!comment.currentUserCanDelete"
    (click)="delete()"
  >
    <mat-icon>delete</mat-icon>
  </button>
</div>
