<div class="w-full py-2">
  @if (comment.assessed) {
    <div class="flex w-full flex-col items-center gap-2 text-center">
      <div class="flex w-full items-center gap-3 text-ot-muted">
        <span
          class="h-px flex-1 bg-gradient-to-r from-transparent to-[var(--ot-color-divider)]"
        ></span>
        <span class="text-sm font-medium">{{ message }}</span>
        <span
          class="h-px flex-1 bg-gradient-to-r from-[var(--ot-color-divider)] to-transparent"
        ></span>
      </div>
      <p class="m-0 text-sm text-ot-muted opacity-80">
        <strong>Reason:</strong> {{ comment.text }}
      </p>
    </div>
  }

  @if (!comment.assessed) {
    <div class="flex w-full flex-col items-center gap-3 text-center">
      <span
        class="h-px w-full bg-gradient-to-r from-transparent via-[var(--ot-color-divider)] to-transparent"
      ></span>
      <p class="m-0 text-sm text-ot-text">
        <span class="block">{{ message }}</span>
        <strong>Reason:</strong> {{ comment.text }}
      </p>
      @if (isNotStudent) {
        <button
          class="!bg-[var(--ot-color-success)]"
          color="primary"
          mat-flat-button
          (click)="grantExtension()"
        >
          Grant
        </button>
      }
      <span
        class="h-px w-full bg-gradient-to-r from-transparent via-[var(--ot-color-divider)] to-transparent"
      ></span>
    </div>
  }
</div>
