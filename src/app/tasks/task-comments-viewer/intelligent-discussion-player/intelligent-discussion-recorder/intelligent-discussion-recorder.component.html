<div>
  <p class="rounded-md bg-ot-raised p-3 text-sm text-ot-warning" [hidden]="canRecord">
    Audio recording is only supported in modern versions of Chrome, Firefox and Safari.
  </p>
  <div
    class="relative overflow-hidden rounded-lg border border-ot-divider bg-ot-raised"
    id="mainDIscussionVisualiser"
    [hidden]="!canRecord"
  >
    <canvas
      #mainDiscussionRecorderVisualiser
      class="h-[72px] w-full"
      id="mainDiscussionRecorderVisualiser"
    ></canvas>
    <div
      class="pointer-events-none absolute inset-0 bg-gradient-to-r from-[var(--ot-scrim)] via-transparent to-[var(--ot-scrim)]"
    ></div>
    <div
      class="absolute inset-0 flex items-center justify-center text-4xl font-semibold text-ot-link"
      [hidden]="!countdownText"
    >
      {{ countdownText }}
    </div>
    <div
      class="absolute inset-0 flex items-center justify-center bg-[var(--ot-scrim)]"
      [hidden]="!isSending"
    >
      <mat-spinner [diameter]="36" [strokeWidth]="2"></mat-spinner>
    </div>
  </div>
</div>
