@if (comment.commentType === 'image') {
  <button
    class="image-attachment"
    type="button"
    [attr.aria-label]="isLoadingImage ? 'Loading image attachment' : 'Preview image attachment'"
    [disabled]="isLoadingImage || !resourceUrl"
    (click)="openCommentsModal()"
  >
    @if (resourceUrl) {
      <img alt="Image attachment preview" [src]="resourceUrl | safe" />
    } @else {
      <mat-icon aria-hidden="true">image</mat-icon>
      <span>Loading image…</span>
    }
  </button>
} @else if (comment.commentType === 'pdf') {
  <sent-attachment-card
    action="preview"
    [comment]="comment"
    (activate)="openCommentsModal()"
  ></sent-attachment-card>
}
