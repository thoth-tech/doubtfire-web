<!-- A plain dialog rather than a card inside one, so the title, body and buttons share
     the dialog's own even padding. -->
<h2 mat-dialog-title>Assess task quality</h2>

<mat-dialog-content class="grade-task-content">
  <p class="m-0 flex min-w-0 items-center gap-2 text-sm text-ot-text">
    <span
      class="inline-flex h-7 shrink-0 items-center rounded-ot-pill bg-ot-primary px-2.5 font-semibold text-ot-on-primary"
    >
      {{ task.definition.abbreviation }}
    </span>
    <span class="min-w-0 truncate">{{ task.definition.name }}</span>
  </p>

  @if (task.definition.isGraded) {
    <section class="flex flex-col gap-2">
      <h3 class="m-0 text-sm font-semibold text-ot-text">Grade</h3>
      <mat-button-toggle-group
        #group="matButtonToggleGroup"
        aria-label="Task grade"
        class="self-start"
        hideSingleSelectionIndicator="true"
        [value]="selectedGrade"
        [(ngModel)]="selectedGrade"
      >
        @for (idx of gradeValues; track idx) {
          <mat-button-toggle
            aria-label="Mark task as {{ gradeName(idx) }}"
            class="p-2"
            matTooltip="This student completed the task to a {{ gradeName(idx) }} standard"
            [matTooltipShowDelay]="500"
            [value]="idx"
          >
            <f-grade-icon [grade]="idx" [unit]="task.unit"></f-grade-icon>
          </mat-button-toggle>
        }
      </mat-button-toggle-group>
    </section>
  }

  @if (task.definition.maxQualityPts > 0) {
    <section class="flex flex-col gap-1">
      <div class="flex items-baseline justify-between gap-3">
        <h3 class="m-0 text-sm font-semibold text-ot-text">Quality rating</h3>
        <span aria-hidden="true" class="text-sm text-ot-muted tabular-nums">
          {{ rating }} / {{ totalRating }}
        </span>
      </div>
      <!-- The top margin leaves room for the value bubble over the thumb. -->
      <mat-slider
        class="mt-4 w-full"
        [discrete]="true"
        [displayWith]="formatQualityRating"
        [max]="totalRating"
        [min]="0"
        [step]="1"
      >
        <input
          aria-label="Task quality rating"
          matSliderThumb
          [ngModel]="rating"
          (ngModelChange)="updateRating($event)"
        />
      </mat-slider>
    </section>
  }
</mat-dialog-content>

<mat-dialog-actions align="end" class="grade-task-actions">
  <button mat-button type="button" (click)="dismiss()">Cancel</button>
  <button
    color="primary"
    mat-flat-button
    type="button"
    [disabled]="!isValid()"
    [mat-dialog-close]="{grade: selectedGrade, qualityPts: rating}"
  >
    Submit
  </button>
</mat-dialog-actions>
