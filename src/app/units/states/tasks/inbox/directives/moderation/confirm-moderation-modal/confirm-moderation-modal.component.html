<h2 mat-dialog-title>
  <span class="flex items-center gap-3">
    <mat-icon aria-hidden="true" class="shrink-0 text-ot-muted">{{ actionIcon }}</mat-icon>
    <span class="flex min-w-0 flex-col">
      <span>{{ title }}</span>
      <span class="text-sm font-normal text-ot-muted">Tutor: {{ tutorName }}</span>
    </span>
  </span>
</h2>
<mat-dialog-content>
  <p class="m-0 text-ot-text">
    {{ description }}
  </p>
  @if (showDismissAll) {
    <mat-checkbox class="mt-3 block" [(ngModel)]="dismissAllTasks">
      Apply this to every {{ task?.definition?.abbreviation }} {{ task?.definition?.name }} task
      from {{ tutorName }} that is waiting for moderation
    </mat-checkbox>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="dismiss()">Cancel</button>
  <button color="primary" mat-flat-button type="button" (click)="runCallback()">Confirm</button>
</mat-dialog-actions>
