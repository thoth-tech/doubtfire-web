<span class="center-buttons mx-3 flex items-center justify-around gap-3">
  @if (task?.moderationType === 'random_sample' || task?.moderationType === 'first_feedback') {
    <button
      aria-label="Show more from this tutor"
      class="button"
      mat-icon-button
      matTooltip="Show more from this tutor"
      matTooltipPosition="above"
      type="button"
      [disabled]="!task || isModerated(task)"
      (click)="showMore()"
    >
      <mat-icon aria-hidden="true">flag</mat-icon>
    </button>
    <button
      aria-label="Snooze this task"
      class="button large-button"
      mat-icon-button
      matTooltip="Snooze this task"
      matTooltipPosition="above"
      type="button"
      [disabled]="!task || isModerated(task)"
      (click)="snooze()"
    >
      <mat-icon aria-hidden="true">snooze</mat-icon>
    </button>
    <button
      aria-label="Dismiss from moderation"
      class="button large-button"
      mat-icon-button
      matTooltip="Dismiss from moderation"
      matTooltipPosition="above"
      type="button"
      [disabled]="!task || isModerated(task)"
      (click)="dismiss()"
    >
      <mat-icon aria-hidden="true">archive</mat-icon>
    </button>
    <button
      aria-label="Show less from this tutor"
      class="button"
      mat-icon-button
      matTooltip="Show less from this tutor"
      matTooltipPosition="above"
      type="button"
      [disabled]="!task || isModerated(task)"
      (click)="showLess()"
    >
      <mat-icon aria-hidden="true">thumb_up</mat-icon>
    </button>
  } @else if (task?.moderationType === 'escalation') {
    <button
      aria-label="Overturn the outcome"
      class="button"
      mat-icon-button
      matTooltip="Overturn the outcome"
      matTooltipPosition="above"
      type="button"
      [disabled]="!task || isModerated(task)"
      (click)="overturn()"
    >
      <mat-icon aria-hidden="true">gavel</mat-icon>
    </button>

    <button
      aria-label="Uphold the outcome"
      class="button"
      mat-icon-button
      matTooltip="Uphold the outcome"
      matTooltipPosition="above"
      type="button"
      [disabled]="!task || isModerated(task)"
      (click)="upheld()"
    >
      <mat-icon aria-hidden="true">verified</mat-icon>
    </button>
  } @else {
    <span class="text-sm text-ot-muted">No moderation actions for this task</span>
  }
</span>
