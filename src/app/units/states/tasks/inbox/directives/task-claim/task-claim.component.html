<div [matTooltip]="claimTooltip">
  <button
    class="ml-3"
    color="primary"
    mat-flat-button
    type="button"
    [disabled]="
      !selectedTask || selectedTask.loadingSubmissionDetails || !!selectedTask.claimedByUnitRoleId
    "
    (click)="claimTask(selectedTask)"
  >
    <mat-icon aria-hidden="true">{{ claimIcon }}</mat-icon>
    {{ claimLabel }}
  </button>
</div>
