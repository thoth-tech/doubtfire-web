<mat-card class="inbox-container">
  <mat-card-header>
    <mat-card-title>Task Inbox</mat-card-title>
  </mat-card-header>
  
  <mat-card-content>
    <f-inbox
      [unit]="unit"
      [taskData]="taskData"
      [unitRole]="unitRole"
      [task]="task"
      [project]="project">
    </f-inbox>
  </mat-card-content>
</mat-card>
