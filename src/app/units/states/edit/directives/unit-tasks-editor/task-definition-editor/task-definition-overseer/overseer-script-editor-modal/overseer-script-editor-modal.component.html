<div class="w-full p-6">
  <div class="w-full text-center">
    <p>{{ data.taskDefinition.abbreviation }} {{ data.taskDefinition.name }}</p>
    <p>Overseer script</p>
  </div>
  <div class="flex justify-end">
    <button aria-label="Save script" mat-icon-button (click)="save()">
      <mat-icon>save</mat-icon>
    </button>
  </div>
  @if (!loading) {
    <ngs-code-editor
      class="h-[70vh] w-full"
      [codeModel]="model"
      [readOnly]="true"
      [theme]="theme.isDark() ? 'vs-dark' : 'vs'"
    ></ngs-code-editor>
  }
</div>
