<mat-form-field appearance="outline" class="w-full sm:max-w-xs" subscriptSizing="dynamic">
  <mat-label>New target grade</mat-label>
  <mat-select [(ngModel)]="editor.actionFor(rule).target_grade">
    @for (grade of editor.targetGrades; track grade.value) {
      <mat-option [value]="grade.value">{{ grade.label }}</mat-option>
    }
  </mat-select>
</mat-form-field>
