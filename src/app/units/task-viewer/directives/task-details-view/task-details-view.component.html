@if (taskDef) {
  <mat-expansion-panel class="mat-elevation-z0" [expanded]="true">
    <mat-expansion-panel-header>
      <mat-panel-title>Task details</mat-panel-title>
    </mat-expansion-panel-header>
    <f-task-description-card [taskDef]="taskDef" [unit]="unit"></f-task-description-card>
  </mat-expansion-panel>
} @else {
  <div class="flex size-full items-center justify-center px-4">
    <f-empty-state icon="assignment" message="No task selected"></f-empty-state>
  </div>
}
