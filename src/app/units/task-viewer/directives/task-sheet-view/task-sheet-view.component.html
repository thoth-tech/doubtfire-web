<div class="size-full overflow-auto">
  @if (taskDef?.hasTaskSheet) {
    <f-pdf-viewer
      [filename]="taskDef.effectiveTaskSheetFilename"
      [pdfUrl]="taskDef.getTaskPDFUrl()"
    ></f-pdf-viewer>
  } @else {
    <div class="flex size-full items-center justify-center px-4">
      <f-empty-state
        hint="Details for this task are above."
        icon="subtitles_off"
        message="This task has no task sheet"
      ></f-empty-state>
    </div>
  }
</div>
