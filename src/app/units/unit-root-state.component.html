@if (unit || (unit$ | async)) {
  <router-outlet (activate)="onActivate($event)"></router-outlet>
} @else {
  <div
    class="flex min-h-64 flex-col items-center justify-center gap-3 px-4 py-12 text-center text-ot-muted"
    role="status"
  >
    <mat-spinner aria-hidden="true" diameter="32"></mat-spinner>
    <p class="m-0 text-sm">Loading the unit...</p>
  </div>
}
