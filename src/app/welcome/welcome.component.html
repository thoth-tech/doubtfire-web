<section class="welcome signed-out-shell flex flex-row">
  <f-hero-sidebar class="self-start max-[959.98px]:hidden"></f-hero-sidebar>
  <section
    class="content signed-out-content flex min-w-0 flex-1 flex-col min-[960px]:overflow-auto"
  >
    <div class="signed-out-card m-auto w-full max-w-md p-4">
      <div class="subcontainer">
        <div class="wordmark flex-row items-center justify-center text-center">
          <img alt="OnTrack logo" src="/assets/images/logo.svg" width="40px" />
          <p>{{ externalName.value }}</p>
        </div>
        <h1 class="welcome-heading self-center text-center">Welcome to {{ externalName.value }}</h1>
        @if (!loading) {
          <f-edit-profile-form mode="create"></f-edit-profile-form>
        }
      </div>
    </div>
  </section>
</section>
