<mat-form-field appearance="outline" subscriptSizing="dynamic">
  <mat-label>Group set</mat-label>
  <mat-select [(ngModel)]="selectedGroupSet" (ngModelChange)="selectGroupSet($event)">
    @for (gs of unit.groupSets; track gs.id) {
      <mat-option [value]="gs">{{ gs.name }}</mat-option>
    }
  </mat-select>
</mat-form-field>
