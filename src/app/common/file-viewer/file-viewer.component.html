<div class="w-full max-w-full">
  @if (blobUrl && fileType === 'pdf') {
    @if (!loaded) {
      <mat-progress-bar
        [mode]="pdfLoadingTotalKnown ? 'determinate' : 'indeterminate'"
        [value]="pdfLoadingProgressPercentage"
      ></mat-progress-bar>
    }
    <pdf-viewer
      class="size-full"
      style="display: block; min-height: 60rem"
      [autoresize]="true"
      [fit-to-page]="true"
      [original-size]="false"
      [render-text]="true"
      [src]="blobUrl"
      (after-load-complete)="onLoaded()"
      (on-progress)="onProgress($event)"
      (page-rendered)="loaded = true"
    ></pdf-viewer>
  }
  @if (fileType === 'html') {
    <!-- An iframe with no height of its own falls back to 150px, which cut a
         similarity report off after its first lines. -->
    <iframe
      class="block h-[32rem] max-h-[70vh] w-full rounded-ot-md border border-ot-divider"
      title="Submission preview"
      [src]="blobUrl | safe"
    ></iframe>
  }
</div>
