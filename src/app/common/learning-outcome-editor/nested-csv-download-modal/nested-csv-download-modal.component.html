<h2 mat-dialog-title>Download {{ what }}</h2>

<mat-dialog-content>
  <p class="m-0 mb-4 text-sm leading-relaxed text-ot-muted">
    The CSV lists every one of the unit's {{ what }}.
  </p>
  <mat-slide-toggle [(ngModel)]="includeNested"
    >Include the {{ what }} of each task too</mat-slide-toggle
  >
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close type="button">Cancel</button>
  <button color="primary" mat-flat-button type="button" (click)="downloadCsv()">Download</button>
</mat-dialog-actions>
