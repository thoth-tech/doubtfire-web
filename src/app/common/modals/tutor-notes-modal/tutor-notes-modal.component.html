<!-- before:hidden drops Material's 40px baseline strut so the title padding reads true. -->
<h2
  class="m-0 px-4 pt-4 pb-1 text-lg leading-snug font-semibold text-ot-text before:hidden"
  mat-dialog-title
>
  Moderation notes
</h2>

<mat-dialog-content class="flex max-h-none min-h-0 flex-col p-0">
  <f-tutor-notes-view
    class="min-h-0 flex-1"
    [inDialog]="true"
    [task]="task"
    [unitRole]="unitRole"
  ></f-tutor-notes-view>
</mat-dialog-content>

<mat-dialog-actions align="end" class="border-t border-ot-divider p-4">
  <button mat-button mat-dialog-close type="button">Close</button>
</mat-dialog-actions>
