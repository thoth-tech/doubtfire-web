<div class="confirmation-modal">
  <mat-dialog-content class="confirmation-modal-header">
    <mat-icon>help</mat-icon>
    <div>
      <h3>{{ data.title }}</h3>
      <h5>Please confirm that you want to perform this action.</h5>
    </div>
  </mat-dialog-content>
  <mat-dialog-content>
    <p>{{ data.message }}</p>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-flat-button class="confirm-btn" (click)="confirm()">
      <mat-icon>check</mat-icon>
      Confirm
    </button>
    <button mat-flat-button color="warn" (click)="cancel()">
      <mat-icon>close</mat-icon>
      Cancel
    </button>
  </mat-dialog-actions>
</div>
