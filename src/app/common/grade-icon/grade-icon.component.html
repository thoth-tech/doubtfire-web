<!-- The inverse pair, so the circle stands out on a card in both themes: near
     black in light, near white in dark. -->
<div>
  <span
    class="m-0 flex size-[2.25em] items-center justify-center rounded-full bg-(--ot-color-inverse-surface) text-[1em] font-medium text-(--ot-color-inverse-text)"
    matTooltip="{{ gradeText }}"
    matTooltipPosition="above"
    [ngClass]="{
      colorful: colorful,
      'grade-0': grade === 0,
      'grade-1': grade === 1,
      'grade-2': grade === 2,
      'grade-3': grade === 3,
    }"
  >
    {{ gradeLetter }}
  </span>
</div>
