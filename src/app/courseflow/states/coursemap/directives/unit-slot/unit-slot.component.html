<div
  class="slot"
  [class.has-unit]="unit"
  cdkDropList
  cdkDropListId="dropListId"
  [cdkDropListData]="dropListData"
  (cdkDropListDropped)="onDrop($event)"
>
  <f-unit-card
    *ngIf="unit"
    [unit]="unit"
    [dragData]="dragData"
    [showMenu]="true"
    [yearIndex]="yearIndex"
    [trimesterKey]="trimesterKey"
    [slotIndex]="slotIndex"
    [showValidation]="true"
    (removeUnit)="onRemoveUnit()"
  >
  </f-unit-card>
</div>
