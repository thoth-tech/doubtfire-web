<div class="trimester-list">
  <div class="trimester-heading">
    <span class="trimester-heading-text"> Trimester {{ getTrimesterNumber() }} </span>
  </div>

  <div class="slots-container">
    <div class="slots-wrapper">
      <div class="slot-item" *ngFor="let slotIndex of slotIndices; trackBy: trackBySlotIndex">
        <unit-slot
          [unit]="trimester[slotIndex]"
          [yearIndex]="yearIndex"
          [trimesterKey]="trimesterKey"
          [slotIndex]="slotIndex"
          [class.overloaded-slot]="slotIndex >= 4"
          (dropEvent)="onSlotDrop($event)"
          (removeUnit)="onRemoveUnit(slotIndex)"
        >
        </unit-slot>

        <!-- Remove slot button for overloaded slots - positioned in middle -->
        <button
          *ngIf="slotIndex >= 4 && canRemoveSlot(slotIndex) && !trimester[slotIndex]"
          class="remove-slot-button"
          mat-icon-button
          (click)="onRemoveSlot(slotIndex)"
          title="Remove this overload slot"
        >
          <mat-icon>remove_circle_outline</mat-icon>
        </button>
      </div>

      <!-- Add slot button - appears after the last slot -->
      <button
        *ngIf="slotIndices.length <= 4"
        class="add-slot-button"
        mat-icon-button
        (click)="onAddSlot()"
        title="Overload trimester"
      >
        <mat-icon>add_circle_outline</mat-icon>
      </button>
    </div>
  </div>

  <!-- Delete button for this specific trimester -->
  <button class="delete-button" mat-icon-button (click)="onDeleteTrimester()">
    <mat-icon>delete</mat-icon>
  </button>
</div>
