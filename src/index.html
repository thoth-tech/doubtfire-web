<!doctype html>
<html lang="en">
  <head>
    <base href="/" />
    <meta content="no-referrer" name="referrer" />

    <!-- THM-F04 pre-boot theme marker. Runs synchronously before any stylesheet
         so the resolved theme is painted before Angular boots and there is no
         incorrect-theme flash. Mirrors ThemeService.applyResolved and reads the
         same storage key ('ontrack.theme.preference' / THEME_STORAGE_KEY). -->
    <script>
      // Only the storage read can throw (private mode, quota). Guard it alone so a
      // throw still falls through to the system value, exactly like
      // ThemeService.readThemePreference, instead of skipping the paint entirely.
      let stored = null;
      try {
        stored = localStorage.getItem('ontrack.theme.preference');
      } catch {
        /* storage blocked; treat as unset and resolve against the OS */
      }
      const prefersDark =
        typeof window.matchMedia === 'function' &&
        window.matchMedia('(prefers-color-scheme: dark)').matches;
      const resolved =
        stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
      document.documentElement.setAttribute('data-ot-theme', resolved);
      document.documentElement.style.colorScheme = resolved;
    </script>

    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <title ng-bind="externalName.value">Loading...</title>

    <!-- Nice favicons for all devices -->
    <link href="/assets/icons/favicon.ico" rel="icon" sizes="any" />
    <!-- 32×32 -->
    <link href="/assets/icons/icon.svg" rel="icon" type="image/svg+xml" />
    <link href="/assets/icons/apple-touch-icon.png" rel="apple-touch-icon" />
    <!-- 180×180 -->
    <link href="/manifest.webmanifest" rel="manifest" />
    <meta content="#3939ff" name="theme-color" />

    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta charset="utf-8" />
    <meta content="IE=edge" http-equiv="X-UA-Compatible" />
    <meta content="Learning and feedback tool." name="description" />

    <!-- HTML5 shim and Respond.js IE8 support of HTML5 elements and media queries -->
    <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
      <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->
  </head>
  <body class="mat-typography">
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
