<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1400"
  height="900"
  viewBox="0 0 1400 900"
  role="img"
  aria-labelledby="ppi-wireframe-title ppi-wireframe-description"
>
  <title id="ppi-wireframe-title">
    Annotated copy-location wireframe for task-level and unit-level peer progress
  </title>
  <desc id="ppi-wireframe-description">
    Two privacy-safe mock Peer Progress Indicator cards. Number one marks the visible label, number
    two marks an accessible help control, and number three marks the expanded explanation. The
    task-level card is current and the unit-level card is a planned proof of concept.
  </desc>

  <rect width="1400" height="900" fill="#ffffff" />

  <text
    x="70"
    y="55"
    font-family="Arial, Helvetica, sans-serif"
    font-size="34"
    font-weight="700"
    fill="#111111"
  >
    PPI-D01 copy-location wireframe
  </text>

  <text x="70" y="88" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#333333">
    Sanitised mock values only. Task-level is current; unit-level is planned.
  </text>

  <!-- Task-level panel -->
  <text
    x="70"
    y="135"
    font-family="Arial, Helvetica, sans-serif"
    font-size="25"
    font-weight="700"
    fill="#111111"
  >
    A. Current task-level widget
  </text>

  <rect
    x="70"
    y="155"
    width="1260"
    height="250"
    rx="20"
    fill="#f8f8f8"
    stroke="#222222"
    stroke-width="3"
  />

  <text
    x="115"
    y="205"
    font-family="Arial, Helvetica, sans-serif"
    font-size="24"
    font-weight="700"
    fill="#111111"
  >
    Peer task progress
  </text>

  <circle cx="370" cy="196" r="18" fill="#222222" />
  <text
    x="370"
    y="203"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    font-weight="700"
    fill="#ffffff"
  >
    1
  </text>

  <circle cx="1260" cy="194" r="26" fill="#ffffff" stroke="#222222" stroke-width="3" />
  <text
    x="1260"
    y="202"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="24"
    font-weight="700"
    fill="#111111"
  >
    ?
  </text>

  <circle cx="1308" cy="194" r="18" fill="#222222" />
  <text
    x="1308"
    y="201"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    font-weight="700"
    fill="#ffffff"
  >
    2
  </text>

  <text x="115" y="252" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111111">
    42% of peers at your target grade have submitted
  </text>

  <rect x="115" y="275" width="620" height="24" rx="12" fill="#dddddd" stroke="#222222" />
  <rect x="115" y="275" width="260" height="24" rx="12" fill="#777777" />
  <text x="755" y="295" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111111">
    42%
  </text>

  <rect
    x="115"
    y="320"
    width="1100"
    height="58"
    rx="10"
    fill="#ffffff"
    stroke="#555555"
    stroke-width="2"
  />

  <text x="140" y="345" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#222222">
    This is one combined group percentage. It does not show names, individual results,
  </text>
  <text x="140" y="368" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#222222">
    raw group size or rankings, and it does not assess your own work.
  </text>

  <circle cx="1250" cy="348" r="18" fill="#222222" />
  <text
    x="1250"
    y="355"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    font-weight="700"
    fill="#ffffff"
  >
    3
  </text>

  <!-- Unit-level panel -->
  <text
    x="70"
    y="460"
    font-family="Arial, Helvetica, sans-serif"
    font-size="25"
    font-weight="700"
    fill="#111111"
  >
    B. Planned PPI-F02 unit-level proof of concept
  </text>

  <rect
    x="70"
    y="480"
    width="1260"
    height="280"
    rx="20"
    fill="#f8f8f8"
    stroke="#222222"
    stroke-width="3"
    stroke-dasharray="12 8"
  />

  <text
    x="115"
    y="530"
    font-family="Arial, Helvetica, sans-serif"
    font-size="24"
    font-weight="700"
    fill="#111111"
  >
    Unit progress overview
  </text>

  <circle cx="390" cy="521" r="18" fill="#222222" />
  <text
    x="390"
    y="528"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    font-weight="700"
    fill="#ffffff"
  >
    1
  </text>

  <circle cx="1260" cy="519" r="26" fill="#ffffff" stroke="#222222" stroke-width="3" />
  <text
    x="1260"
    y="527"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="24"
    font-weight="700"
    fill="#111111"
  >
    ?
  </text>

  <circle cx="1308" cy="519" r="18" fill="#222222" />
  <text
    x="1308"
    y="526"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    font-weight="700"
    fill="#ffffff"
  >
    2
  </text>

  <text
    x="115"
    y="579"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    font-weight="700"
    fill="#111111"
  >
    My progress
  </text>
  <rect x="300" y="558" width="550" height="24" rx="12" fill="#dddddd" stroke="#222222" />
  <rect x="300" y="558" width="347" height="24" rx="12" fill="#555555" />
  <text x="875" y="579" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#111111">
    63%
  </text>

  <text
    x="115"
    y="626"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    font-weight="700"
    fill="#111111"
  >
    Anonymous group progress
  </text>
  <rect x="390" y="605" width="460" height="24" rx="12" fill="#dddddd" stroke="#222222" />
  <rect x="390" y="605" width="193" height="24" rx="12" fill="#888888" />
  <text x="875" y="626" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#111111">
    42%
  </text>

  <rect
    x="115"
    y="660"
    width="1100"
    height="70"
    rx="10"
    fill="#ffffff"
    stroke="#555555"
    stroke-width="2"
  />

  <text x="140" y="686" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#222222">
    My progress and Anonymous group progress are separate values. The group value does
  </text>
  <text x="140" y="710" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#222222">
    not show names, individual results, raw group size, marks, feedback or rankings.
  </text>

  <circle cx="1250" cy="695" r="18" fill="#222222" />
  <text
    x="1250"
    y="702"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    font-weight="700"
    fill="#ffffff"
  >
    3
  </text>

  <!-- Legend -->
  <text
    x="70"
    y="810"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    font-weight="700"
    fill="#111111"
  >
    Callouts
  </text>

  <circle cx="205" cy="803" r="17" fill="#222222" />
  <text
    x="205"
    y="810"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    font-weight="700"
    fill="#ffffff"
  >
    1
  </text>
  <text x="235" y="810" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222222">
    Visible label
  </text>

  <circle cx="430" cy="803" r="17" fill="#222222" />
  <text
    x="430"
    y="810"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    font-weight="700"
    fill="#ffffff"
  >
    2
  </text>
  <text x="460" y="810" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222222">
    Keyboard, touch and screen-reader accessible help control
  </text>

  <circle cx="955" cy="803" r="17" fill="#222222" />
  <text
    x="955"
    y="810"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    font-weight="700"
    fill="#ffffff"
  >
    3
  </text>
  <text x="985" y="810" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222222">
    Expanded explanation
  </text>

  <text x="70" y="860" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#333333">
    Based on the earlier unit-level PPI visual baseline by Umeda Ranuluge. Sanitised and updated for
    PPI-D01 copy placement. No real student data is shown.
  </text>
</svg>
