worker_processes 1;

events {  }

http {
    include /etc/nginx/mime.types;

    # The Angular app shell and service-worker control files must always be
    # revalidated. `$uri` excludes query parameters, so cache-busting query
    # strings cannot bypass this policy. An empty value is not emitted for
    # fingerprinted bundles and other static assets.
    map $uri $ontrack_control_file_cache_control {
        default                       "";
        /index.html                   "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        /ngsw.json                    "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        /ngsw-worker.js               "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        /safety-worker.js             "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        /worker-basic.min.js          "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        /manifest.webmanifest         "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    sendfile on;
    server {
        root /usr/share/nginx/html/;
        index index.html;
        listen 80;

        add_header Content-Security-Policy "default-src https: 'unsafe-inline' 'unsafe-eval' blob: data: ws:; worker-src 'self' blob:; child-src 'self' blob:" always;
        add_header Permissions-Policy "microphone=(self),fullscreen=(self),payment=()" always;
        add_header Cache-Control $ontrack_control_file_cache_control always;

        # Do not serve the SPA fallback under a service-worker or manifest URL.
        # A missing control file must be a real 404, otherwise browsers can try
        # to execute index.html as JavaScript. Internal SPA fallback redirects
        # still resolve through the exact /index.html location below.
        location = /index.html {
          try_files $uri =404;
        }

        location = /ngsw.json {
          try_files $uri =404;
        }

        location = /ngsw-worker.js {
          try_files $uri =404;
        }

        location = /safety-worker.js {
          try_files $uri =404;
        }

        location = /worker-basic.min.js {
          try_files $uri =404;
        }

        location = /manifest.webmanifest {
          try_files $uri =404;
        }

        location / {
          try_files $uri $uri/ $uri/index.html /index.html;
        }
    }

    gzip on;
    gzip_types text/css application/javascript;
    gzip_proxied any;
    gzip_buffers 32 8k;

}
