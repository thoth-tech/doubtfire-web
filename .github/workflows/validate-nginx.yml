name: Validate production Nginx

on:
  pull_request:
    paths:
      - nginx.conf
      - deploy.Dockerfile
      - src/manifest.webmanifest
      - scripts/test-nginx.py
      - .github/workflows/validate-nginx.yml
  push:
    branches: ["11.0.x"]
    paths:
      - nginx.conf
      - deploy.Dockerfile
      - src/manifest.webmanifest
      - scripts/test-nginx.py
      - .github/workflows/validate-nginx.yml

permissions:
  contents: read

concurrency:
  group: nginx-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nginx:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Exercise static responses from the production configuration
        run: python3 -B scripts/test-nginx.py
